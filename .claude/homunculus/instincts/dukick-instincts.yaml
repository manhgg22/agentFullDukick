# Start Dukick-tong Last

## Action
Always start Dukick-tong-8767 AFTER all other agents are running. It is the coordinator.

## Evidence
- Dukick-tong reads all 4 other vaults — they must exist and be populated first
- Start order: truyenthong → pm → pmcreative → neolab → tong

