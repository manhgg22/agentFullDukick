# Agent Isolation Rule

## Action
Changes to one agent (SOUL.md, config.yaml, .env) must NOT be copied to other agents without explicit request. Each agent has a distinct role.

## Evidence
- 5 agents serve different departments: tong, truyenthong, pm, pmcreative, neolab
- Dukick-tong is coordinator — its SOUL.md includes all vault paths

