# Hook Scripts Must Exit Cleanly

## Action
Hook scripts must always exit with `sys.exit(0)` on error, and return `{"action": "allow"}` on success. Never raise unhandled exceptions — this would block the Discord bot.

## Evidence
- `save_to_obsidian.py` pattern: parse → process → print allow → exit 0
- Hook timeout is 5 seconds — no heavy operations allowed
