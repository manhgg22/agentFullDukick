# Always Specify UTF-8 Encoding

## Action
Always use `encoding="utf-8"` in `open()` calls. Windows default encoding causes issues with Vietnamese text.

## Evidence
- Obsidian vault contains Vietnamese content
- Discord messages may contain Vietnamese characters
- `save_to_obsidian.py` uses utf-8 throughout

