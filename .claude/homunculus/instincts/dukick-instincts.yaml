# Never Commit .env Files

## Action
Always check that `.env` files are excluded before committing. These contain Discord bot tokens.

## Evidence
- Each agent folder has a `.env` with `DISCORD_BOT_TOKEN`
- `.gitignore` excludes `*/.env` and `.env`

