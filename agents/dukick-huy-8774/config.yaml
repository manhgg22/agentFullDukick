name: hermes_DukickHuy
port: 8774
discord:
  require_mention: true
  auto_thread: false
  thread_require_mention: true
  history_backfill: true
  status: online
  activity: Huy Agent | @tag de hoi
model: glm-5.2
provider: ollama-cloud
fallback:
- model: glm-5.2
  provider: ollama-cloud
  api_key: ''
  base_url: https://ollama.com/v1
streaming: false
max_tokens: 4000
toolsets:
- core
- files
- web
- browser
- code_execution
hooks:
  pre_gateway_dispatch:
  - command: C:/DukickAgent/venv/Scripts/python.exe C:/DukickAgent/save_to_obsidian.py
    timeout: 5
obsidian:
  vault: C:\Users\Admin\Documents\Obsidian Vault\Dukick-Huy
memory:
  enabled: true
  path: ./memories
logging:
  level: info
  file: ./logs/agent.log
display:
  tool_progress: false
  show_tool_calls: false
  platforms:
    discord:
      tool_progress: false
      show_token_analytics: true
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
mcp_servers:
  markitdown:
    command: C:/DukickAgent/venv/Scripts/python.exe
    args:
    - C:/DuKickAgent/tools/markitdown_mcp_server.py
    env:
      PYTHONIOENCODING: utf-8
    timeout: 120
